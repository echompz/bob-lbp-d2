# ---------------------------------------------------------------------------
# Scripted fraud rules - evaluated with the Nashorn JavaScript engine.
# Nashorn was deprecated in Java 11 and REMOVED in Java 15.
#
# Each rule: rule.<NAME>.expression = <boolean JS expression>
#            rule.<NAME>.score      = <points added when the expression is true>
#
# Available bindings: claimAmount, coverageLimit, policyType,
#                     policyAgeDays, priorClaimCount
# ---------------------------------------------------------------------------

rule.HIGH_COVERAGE_RATIO.expression=claimAmount / coverageLimit > 0.9
rule.HIGH_COVERAGE_RATIO.score=20

rule.ROUND_AMOUNT.expression=claimAmount >= 5000 && claimAmount % 1000 == 0
rule.ROUND_AMOUNT.score=10

rule.TRAVEL_HIGH_VALUE.expression=policyType == 'TRAVEL' && claimAmount > 10000
rule.TRAVEL_HIGH_VALUE.score=15
