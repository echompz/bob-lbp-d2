# ---------------------------------------------------------------------------
# ClaimTrack - Spring Boot 1.5 configuration (LEGACY property names)
# Several keys below were renamed or removed in Boot 2.x / 3.x.
# See docs/MODERNIZATION_CATALOG.md, section "Configuration".
# ---------------------------------------------------------------------------

spring.application.name=claimtrack
server.port=8080
server.context-path=/claimtrack

# --- Datasource (H2 in-memory) ---
spring.datasource.url=jdbc:h2:mem:claimtrack;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate 5.0 ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Multipart uploads (Boot 1.x key) ---
spring.http.multipart.max-file-size=5MB
spring.http.multipart.max-request-size=6MB

# --- Actuator (Boot 1.x: endpoints at the root, security flag) ---
management.security.enabled=false
endpoints.health.sensitive=false
endpoints.info.sensitive=false

info.app.name=ClaimTrack
info.app.description=Acme Insurance claims processing (legacy baseline)
info.app.version=@project.version@
info.app.java.version=@java.version@

# --- Logging ---
logging.level.com.acme.claims=INFO
logging.level.com.acme.claims.config.RequestTimingInterceptor=DEBUG

# --- Fraud engine ---
# Java rules are instantiated reflectively (Class.newInstance) from this list.
claimtrack.fraud.rule-classes=\
  com.acme.claims.service.fraud.HighValueClaimRule,\
  com.acme.claims.service.fraud.EarlyClaimRule,\
  com.acme.claims.service.fraud.LateReportingRule,\
  com.acme.claims.service.fraud.FrequentClaimantRule
claimtrack.fraud.escalation-threshold=60

# --- Claims policy ---
claimtrack.claims.max-reporting-days=365

# --- Stale-claim escalation job (java.util.Timer) ---
claimtrack.escalation.enabled=true
claimtrack.escalation.interval-ms=300000
claimtrack.escalation.stale-days=14
